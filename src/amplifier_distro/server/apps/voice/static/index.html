<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amplifier Voice</title>
<script src="/apps/voice/static/vendor.js"></script>
<style>
/* ------------------------------------------------------------------ */
/*  CSS: dark theme, system-ui font, flex column layout, 900px max     */
/* ------------------------------------------------------------------ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a1a;
  color: #f0f0f0;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 24px 16px;
}

/* ------------------------------------------------------------------ */
/*  App container                                                       */
/* ------------------------------------------------------------------ */
#app {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ------------------------------------------------------------------ */
/*  Header                                                             */
/* ------------------------------------------------------------------ */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  border-bottom: 1px solid #333;
}

.app-title {
  font-size: 22px;
  font-weight: 700;
  color: #f0f0f0;
}

/* ------------------------------------------------------------------ */
/*  Status badge                                                       */
/* ------------------------------------------------------------------ */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid transparent;
}

.status-badge.idle {
  background: #2a2a2a;
  color: #888;
  border-color: #333;
}

.status-badge.connecting {
  background: #2a2200;
  color: #f59e0b;
  border-color: #5a4000;
}

.status-badge.connected {
  background: #002a12;
  color: #22c55e;
  border-color: #005025;
}

.status-badge.disconnected {
  background: #2a0000;
  color: #ef4444;
  border-color: #500000;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.status-badge.connecting .status-dot {
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ------------------------------------------------------------------ */
/*  Error banner                                                       */
/* ------------------------------------------------------------------ */
.error-banner {
  background: #2a0000;
  border: 1px solid #500000;
  border-radius: 8px;
  padding: 12px 16px;
  color: #ef4444;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ------------------------------------------------------------------ */
/*  Transcript                                                         */
/* ------------------------------------------------------------------ */
.transcript-container {
  flex: 1;
  min-height: 300px;
  max-height: 500px;
  overflow-y: auto;
  background: #111;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.transcript-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #555;
  font-size: 14px;
  font-style: italic;
}

.message-bubble {
  display: flex;
  flex-direction: column;
  max-width: 72%;
}

.message-bubble.user {
  align-self: flex-end;
  align-items: flex-end;
}

.message-bubble.assistant {
  align-self: flex-start;
  align-items: flex-start;
}

.bubble-label {
  font-size: 11px;
  color: #666;
  margin-bottom: 4px;
  text-transform: capitalize;
}

.bubble-text {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
}

.message-bubble.user .bubble-text {
  background: #1d4ed8;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.message-bubble.assistant .bubble-text {
  background: #222;
  color: #e5e5e5;
  border: 1px solid #333;
  border-bottom-left-radius: 4px;
}

/* ------------------------------------------------------------------ */
/*  Controls                                                           */
/* ------------------------------------------------------------------ */
.controls {
  display: flex;
  gap: 12px;
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s ease, background 0.15s ease;
  flex: 1;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-start {
  background: #2563eb;
  color: #fff;
}

.btn-start:hover:not(:disabled) {
  background: #1d4ed8;
}

.btn-disconnect {
  background: #dc2626;
  color: #fff;
}

.btn-disconnect:hover:not(:disabled) {
  background: #b91c1c;
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  'use strict';

  // Pull globals from vendor.js
  const { h, render, Fragment } = window.preact;
  const { useState, useEffect, useRef, useCallback } = window.preactHooks;
  const html = window.html;

  // -------------------------------------------------------------------------
  // useWebRTC({ onMessage, onStateChange })
  // -------------------------------------------------------------------------

  function useWebRTC({ onMessage, onStateChange }) {
    const [rtcState, setRtcState] = useState('idle');
    const pcRef = useRef(null);
    const dcRef = useRef(null);
    const tokenRef = useRef(null);
    const streamRef = useRef(null);  // holds MediaStream for track cleanup
    const audioRef = useRef(null);   // holds <audio> element for DOM cleanup

    // Helper: update both local state and notify parent
    const updateState = useCallback((state) => {
      setRtcState(state);
      if (onStateChange) onStateChange(state);
    }, [onStateChange]);

    // -----------------------------------------------------------------------
    // connect()
    // -----------------------------------------------------------------------
    const connect = useCallback(async () => {
      updateState('connecting');

      // Step 1: Fetch ephemeral token from backend
      let token;
      try {
        const resp = await fetch('/apps/voice/session');
        if (!resp.ok) throw new Error(`Session token fetch failed: ${resp.status}`);
        const data = await resp.json();
        token = data.value;
      } catch (err) {
        console.error('[useWebRTC] Failed to fetch session token:', err);
        updateState('disconnected');
        throw err;
      }
      tokenRef.current = token;

      // Step 2: Create RTCPeerConnection with STUN
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
      });
      pcRef.current = pc;

      // Step 3: Get user microphone audio and add track
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        console.error('[useWebRTC] getUserMedia failed:', err);
        pc.close();
        updateState('disconnected');
        throw err;
      }
      streamRef.current = stream;  // store so disconnect() can stop tracks
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));

      // Step 4: Play incoming audio tracks from OpenAI
      pc.ontrack = (event) => {
        if (audioRef.current) audioRef.current.remove(); // replace any prior element
        const audio = document.createElement('audio');
        audio.autoplay = true;
        audio.srcObject = event.streams[0] || new MediaStream([event.track]);
        document.body.appendChild(audio);
        audioRef.current = audio;
      };

      // Step 5: Create data channel for OpenAI events
      const dc = pc.createDataChannel('oai-events');
      dcRef.current = dc;

      // Step 6 & 7: On data channel open — two-stage VAD setup
      dc.onopen = () => {
        // Stage 1: server_vad with noise reduction + transcription
        const stage1 = {
          type: 'session.update',
          session: {
            turn_detection: {
              type: 'server_vad',
              threshold: 0.5,
              prefix_padding_ms: 300,
              silence_duration_ms: 500,
            },
            noise_reduction: { type: 'near_field' },
            input_audio_transcription: {
              model: 'gpt-4o-transcribe',
            },
          },
        };
        dc.send(JSON.stringify(stage1));

        // Stage 2: semantic_vad — must be sent AFTER initial server_vad
        // (GA API constraint: semantic_vad cannot be the initial type)
        setTimeout(() => {
          if (dc.readyState !== 'open') return;
          const stage2 = {
            type: 'session.update',
            session: {
              turn_detection: {
                type: 'semantic_vad',
                eagerness: 'low',
                create_response: false,
                interrupt_response: true,
              },
            },
          };
          dc.send(JSON.stringify(stage2));
        }, 100);
      };

      // Step 8: Forward data channel messages to caller
      dc.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (onMessage) onMessage(msg);
        } catch (err) {
          console.warn('[useWebRTC] Failed to parse data channel message:', err);
        }
      };

      // Step 9: Track ICE connection state changes
      pc.oniceconnectionstatechange = () => {
        const iceState = pc.iceConnectionState;
        console.debug('[useWebRTC] ICE connection state:', iceState);
        if (iceState === 'connected' || iceState === 'completed') {
          updateState('connected');
        } else if (iceState === 'disconnected' || iceState === 'failed' || iceState === 'closed') {
          updateState('disconnected');
        }
      };

      // Step 10: SDP exchange
      // Create offer and set as local description
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      // Wait for ICE gathering to complete (max 2 seconds)
      await new Promise((resolve) => {
        if (pc.iceGatheringState === 'complete') {
          resolve();
          return;
        }
        const timer = setTimeout(resolve, 2000);
        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === 'complete') {
            clearTimeout(timer);
            resolve();
          }
        };
      });

      // POST SDP offer to backend, get SDP answer
      let sdpAnswer;
      try {
        const sdpResp = await fetch('/apps/voice/sdp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/sdp',
            'Authorization': `Bearer ${token}`,
          },
          body: pc.localDescription.sdp,
        });
        if (!sdpResp.ok) throw new Error(`SDP exchange failed: ${sdpResp.status}`);
        sdpAnswer = await sdpResp.text();
      } catch (err) {
        console.error('[useWebRTC] SDP exchange failed:', err);
        pc.close();
        updateState('disconnected');
        throw err;
      }

      // Set remote description with the SDP answer
      await pc.setRemoteDescription({ type: 'answer', sdp: sdpAnswer });
    }, [onMessage, updateState]);

    // -----------------------------------------------------------------------
    // disconnect()
    // -----------------------------------------------------------------------
    const disconnect = useCallback(() => {
      if (dcRef.current) {
        try { dcRef.current.close(); } catch (_) { /* ignore: already closed */ }
        dcRef.current = null;
      }
      if (pcRef.current) {
        try { pcRef.current.close(); } catch (_) { /* ignore: already closed */ }
        pcRef.current = null;
      }
      if (streamRef.current) {
        streamRef.current.getTracks().forEach((t) => t.stop());
        streamRef.current = null;
      }
      if (audioRef.current) {
        audioRef.current.remove();
        audioRef.current = null;
      }
      tokenRef.current = null;
      updateState('idle');
    }, [updateState]);

    // -----------------------------------------------------------------------
    // sendDataChannelMessage(msg)
    // -----------------------------------------------------------------------
    const sendDataChannelMessage = useCallback((msg) => {
      const dc = dcRef.current;
      if (dc && dc.readyState === 'open') {
        dc.send(JSON.stringify(msg));
      } else {
        console.warn('[useWebRTC] Data channel not open, cannot send message');
      }
    }, []);

    return { rtcState, connect, disconnect, sendDataChannelMessage, dcRef };
  }

  // -------------------------------------------------------------------------
  // useChatMessages({ sendDataChannelMessage, sessionId })   Task 5.3
  // -------------------------------------------------------------------------

  function useChatMessages({ sendDataChannelMessage, sessionId }) {
    const [messages, setMessages] = useState([]);
    const [responseInProgress, setResponseInProgress] = useState(false);

    // Refs — mutations without triggering rerenders
    const pendingAnnouncements = useRef([]);
    const messageRefs = useRef({});
    const currentStreamingId = useRef(null);
    // Shadow ref so async callbacks always see the current responseInProgress value
    const responseInProgressRef = useRef(false);

    // Keep state and ref in sync together
    const setRip = useCallback((val) => {
      responseInProgressRef.current = val;
      setResponseInProgress(val);
    }, []);

    // addUserMessage(transcript, itemId): add a user bubble
    const addUserMessage = useCallback((transcript, itemId) => {
      const id = itemId || ('user-' + Date.now());
      setMessages((prev) => [...prev, { id, role: 'user', content: transcript }]);
    }, []);

    // startAssistantMessage(): add an empty assistant bubble, set currentStreamingId
    const startAssistantMessage = useCallback(() => {
      const id = 'asst-' + Date.now();
      currentStreamingId.current = id;
      setMessages((prev) => [...prev, { id, role: 'assistant', content: '' }]);
    }, []);

    // clearMessages(): reset all chat state (called on disconnect)
    const clearMessages = useCallback(() => {
      setMessages([]);
      setRip(false);
      pendingAnnouncements.current = [];
      currentStreamingId.current = null;
      messageRefs.current = {};
    }, [setRip]);

    // handleDataChannelEvent(event) async — main OpenAI Realtime event dispatcher
    const handleDataChannelEvent = useCallback(async (event) => {
      const { type } = event;
      console.debug('[useChatMessages] event:', type);

      // VAD speech detection — no UI change needed
      if (type === 'input_audio_buffer.speech_started') return;

      // User finished speaking — show transcription, trigger reply if idle
      if (type === 'conversation.item.input_audio_transcription.completed') {
        addUserMessage(event.transcript || '', event.item_id);
        if (!responseInProgressRef.current) {
          sendDataChannelMessage({ type: 'response.create' });
        }
        return;
      }

      // Streaming assistant text — DIRECT DOM mutation, zero Preact rerenders
      if (type === 'response.audio_transcript.delta') {
        const id = currentStreamingId.current;
        if (id && messageRefs.current[id]) {
          messageRefs.current[id].textContent += event.delta || '';
        }
        return;
      }

      // Streaming finished — commit final transcript to state
      if (type === 'response.audio_transcript.done') {
        const id = currentStreamingId.current;
        setMessages((prev) =>
          prev.map((m) => (m.id === id ? { ...m, content: event.transcript || '' } : m))
        );
        currentStreamingId.current = null;
        return;
      }

      // Response cycle started
      if (type === 'response.created') {
        setRip(true);
        startAssistantMessage();
        return;
      }

      // Response cycle completed — flush any queued follow-ups
      if (type === 'response.done') {
        setRip(false);
        const pending = pendingAnnouncements.current.splice(0);
        if (pending.length > 0) {
          sendDataChannelMessage({ type: 'response.create' });
        }
        return;
      }

      // Tool call from the model
      if (type === 'response.output_item.added') {
        const item = event.item;
        if (!item || item.type !== 'function_call') return;

        const toolName = item.name;
        const callId = item.call_id;
        const args = item.arguments || '{}';

        // Browser-side tools — TODO 5.4: handle pause_replies / resume_replies
        if (toolName === 'pause_replies' || toolName === 'resume_replies') return;

        // Execute tool on the server
        let output;
        try {
          const resp = await fetch('/apps/voice/tools/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tool_name: toolName,
              arguments: args,
              call_id: callId,
              session_id: sessionId,
            }),
          });
          const data = await resp.json();
          output = JSON.stringify(data);
        } catch (err) {
          console.error('[useChatMessages] Tool execution failed:', err);
          output = JSON.stringify({ error: String(err) });
        }

        // Return the tool result to the model via function_call_output
        sendDataChannelMessage({
          type: 'conversation.item.create',
          item: { type: 'function_call_output', call_id: callId, output },
        });

        // Trigger the next assistant turn, or queue it until response.done
        if (!responseInProgressRef.current) {
          sendDataChannelMessage({ type: 'response.create' });
        } else {
          pendingAnnouncements.current.push({ type: 'response.create' });
        }
      }
    }, [sendDataChannelMessage, sessionId, addUserMessage, startAssistantMessage, setRip]);

    return { messages, responseInProgress, messageRefs, handleDataChannelEvent, clearMessages };
  }

  // -------------------------------------------------------------------------
  // VoiceApp root component
  // -------------------------------------------------------------------------

  function VoiceApp() {
    const [error, setError] = useState(null);
    const [isConnecting, setIsConnecting] = useState(false);
    const [sessionId, setSessionId] = useState(null);  // Task 5.3: session state
    const transcriptEndRef = useRef(null);

    // Stable message handler ref — breaks the circular hook dependency:
    // useWebRTC.onMessage → useChatMessages.handleDataChannelEvent → sendDataChannelMessage
    const msgHandlerRef = useRef(null);
    const stableMsgHandler = useCallback((msg) => {
      if (msgHandlerRef.current) msgHandlerRef.current(msg);
    }, []);

    // handleRtcMessage kept as alias for backward compatibility; now routes via stableMsgHandler
    const handleRtcMessage = stableMsgHandler;

    const handleStateChange = useCallback((state) => {
      console.debug('[VoiceApp] RTC state changed:', state);
    }, []);

    const { rtcState, connect, disconnect, sendDataChannelMessage } = useWebRTC({
      onMessage: stableMsgHandler,
      onStateChange: handleStateChange,
    });

    const {
      messages,
      messageRefs,
      handleDataChannelEvent,
      clearMessages,
    } = useChatMessages({ sendDataChannelMessage, sessionId });

    // Wire latest handler into stable ref on every render (ref mutation, no rerender)
    msgHandlerRef.current = handleDataChannelEvent;

    // Scroll transcript to bottom when new messages arrive
    useEffect(() => {
      if (transcriptEndRef.current) {
        transcriptEndRef.current.scrollIntoView({ behavior: 'smooth' });
      }
    }, [messages]);

    // handleConnect: POST /apps/voice/sessions then initiate WebRTC
    const handleConnect = useCallback(async () => {
      setError(null);
      setIsConnecting(true);
      try {
        // Create Amplifier session on the server
        const sessResp = await fetch('/apps/voice/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: null,
        });
        if (!sessResp.ok) {
          throw new Error(`Failed to create session: ${sessResp.status}`);
        }
        const sessData = await sessResp.json();
        setSessionId(sessData.session_id);
        console.debug('[VoiceApp] Session created:', sessData.session_id);

        // Now initiate WebRTC connection
        await connect();
      } catch (err) {
        console.error('[VoiceApp] Connection failed:', err);
        disconnect(); // ensure full cleanup on any partial failure
        setError(err.message || 'Connection failed. Please try again.');
      } finally {
        setIsConnecting(false);
      }
    }, [connect, disconnect]);

    const handleDisconnect = useCallback(() => {
      disconnect();
      clearMessages();
      setSessionId(null);
      setError(null);
    }, [disconnect, clearMessages]);

    // Derive display state
    const isIdle = rtcState === 'idle';
    const statusLabel = {
      idle: 'Disconnected',
      connecting: 'Connecting…',
      connected: 'Connected',
      disconnected: 'Disconnected',
    }[rtcState] || 'Disconnected';

    return html`
      <div id="app">
        <div class="app-header">
          <div class="app-title">Amplifier Voice</div>
          <div class=${'status-badge ' + rtcState}>
            <div class="status-dot"></div>
            ${statusLabel}
          </div>
        </div>

        ${error && html`
          <div class="error-banner">
            <span>⚠</span>
            <span>${error}</span>
          </div>
        `}

        <div class="transcript-container">
          ${messages.length === 0
            ? html`<div class="transcript-empty">No messages yet. Start a voice chat to begin.</div>`
            : messages.map((msg) => html`
                <div key=${msg.id} class=${'message-bubble ' + msg.role}>
                  <div class="bubble-label">${msg.role}</div>
                  <div
                    class="bubble-text"
                    ref=${(el) => {
                      if (el) messageRefs.current[msg.id] = el;
                      else delete messageRefs.current[msg.id];
                    }}
                  >${msg.content}</div>
                </div>
              `)
          }
          <div ref=${transcriptEndRef}></div>
        </div>

        <div class="controls">
          ${isIdle || rtcState === 'disconnected'
            ? html`
                <button
                  class="btn btn-start"
                  onClick=${handleConnect}
                  disabled=${isConnecting}
                >
                  ${isConnecting ? 'Connecting…' : 'Start Voice Chat'}
                </button>
              `
            : html`
                <button
                  class="btn btn-disconnect"
                  onClick=${handleDisconnect}
                  disabled=${rtcState === 'connecting'}
                >
                  Disconnect
                </button>
              `
          }
        </div>
      </div>
    `;
  }

  // -------------------------------------------------------------------------
  // Mount app
  // -------------------------------------------------------------------------
  render(h(VoiceApp, null), document.getElementById('app'));

})();
</script>
</body>
</html>
